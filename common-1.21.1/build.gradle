architectury {
    common project.enabled_platforms.split(',')
}

dependencies {
    implementation project(':common')
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "dev.architectury:architectury:$architectury_api_version"
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        project(':common').sourceSets.main.output
    }
}

loom { mixin { defaultRefmapName = "celestial_nail.refmap.json" } }

dependencies { modCompileOnly "com.nstut:perfomant_boom-common-1.21.1:${rootProject.boom_version}" }

// Shared procedural client compositor; deliberately excluded from the pure common test module.
sourceSets.main.java.srcDir rootProject.file('common-client/src/main/java')
