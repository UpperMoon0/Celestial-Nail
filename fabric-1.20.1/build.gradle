plugins {
    id 'com.gradleup.shadow'
}

// Sodium 0.5.13 requires Minecraft 1.20.1's LWJGL 3.3.1, including matching natives.
// Loom otherwise upgrades this dev launch to 3.3.2, which Sodium rejects at startup.
configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.lwjgl') {
            useVersion '3.3.1'
            because 'Keep Sodium 0.5.x development libraries and natives on Minecraft 1.20.1 LWJGL'
        }
    }
}

loom {
    runs {
        client {
            client()
            runDir("run/client")
        }
        server {
            server()
            runDir("run/server")
        }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Local compatibility mods are remapped for development and excluded from releases.
    modLocalRuntime fileTree(dir: rootProject.file('.dependencies/dev-renderers/fabric-1.20.1'), include: ['*.jar'])
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$architectury_api_version"

    common(project(path: ':common-1.20.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.20.1', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

dependencies { modImplementation "com.nstut:perfomant_boom-fabric:${rootProject.boom_version}" }

apply from: rootProject.file('tools/gradle/sodium-extras-fixture.gradle')
