name: Release

# A main-branch version bump releases automatically. Workflow/tooling repairs can
# retry an untagged version, and manual runs retry publication at the same SHA.
on:
  push:
    branches: [main]
    paths:
      - gradle.properties
      - .github/workflows/**
      - .github/reproducible.gradle
      - tools/release.py
      - changelog/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celestial-nail-release
  cancel-in-progress: false

jobs:
  plan:
    name: Check version and release preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      changelog: ${{ steps.plan.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare mod_version and reject tag collisions
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python tools/release.py plan
      - name: Require configured CurseForge projects
        if: steps.plan.outputs.release == 'true'
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          PERFOMANT_BOOM_PROJECT_ID: ${{ vars.PERFOMANT_BOOM_PROJECT_ID }}
          PERFOMANT_BOOM_REF: ${{ vars.PERFOMANT_BOOM_REF }}
        run: |
          [[ "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ ]] || { echo 'Set CURSEFORGE_PROJECT_ID' >&2; exit 1; }
          [[ "$PERFOMANT_BOOM_PROJECT_ID" =~ ^[0-9]+$ ]] || { echo 'Set PERFOMANT_BOOM_PROJECT_ID' >&2; exit 1; }
          [[ "$PERFOMANT_BOOM_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Pin PERFOMANT_BOOM_REF to the tested dependency commit' >&2; exit 1; }

  checks:
    name: Validate exact release commit
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/validate.yml

  package:
    name: Build and verify complete release artifacts
    needs: [plan, checks]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/checkout@v4
        with:
          repository: UpperMoon0/Perfomant-Boom
          ref: ${{ vars.PERFOMANT_BOOM_REF }}
          path: .dependencies/perfomant-boom
          persist-credentials: false
      - name: Build the pinned terrain dependency
        working-directory: .dependencies/perfomant-boom
        run: bash gradlew buildAll publishToMavenLocal --no-daemon --max-workers=2
      - name: Build and exercise the release classes
        run: |
          bash gradlew :common:test buildAll :neoforge-1.21.1:runGameTestServer -I .github/reproducible.gradle --no-daemon --max-workers=2
          python tools/release.py package
          python tools/release.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: build/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-evidence
          path: |
            **/build/test-results/**
            neoforge-1.21.1/run/runtime-tests/logs/**
          if-no-files-found: warn

  curseforge:
    name: Publish ${{ matrix.loader }} to CurseForge
    needs: [plan, checks, package]
    if: needs.plan.outputs.release == 'true' && vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            target: fabric-1.20.1
            minecraft: 1.20.1
            dependencies: "419699(required)\n306612(required)"
          - loader: forge
            target: forge-1.20.1
            minecraft: 1.20.1
            dependencies: "419699(required)"
          - loader: fabric
            target: fabric-1.21.1
            minecraft: 1.21.1
            dependencies: "419699(required)\n306612(required)"
          - loader: neoforge
            target: neoforge-1.21.1
            minecraft: 1.21.1
            dependencies: ""
          - loader: neoforge
            target: neoforge-26.1.2
            minecraft: 26.1.2
            dependencies: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts
      - name: Verify exact tested artifacts and required credentials
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          test -n "$CURSEFORGE_API_TOKEN" || { echo 'Missing required secret CURSEFORGE_API_TOKEN' >&2; exit 1; }
          git fetch origin --tags
          python tools/release.py guard-tag
          python tools/release.py verify --directory artifacts
      - uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          files: artifacts/celestial-nail-${{ matrix.target }}-${{ needs.plan.outputs.version }}.jar
          name: Celestial Nail ${{ needs.plan.outputs.version }} - ${{ matrix.loader }} ${{ matrix.minecraft }}
          version: ${{ needs.plan.outputs.version }}-${{ matrix.loader }}-${{ matrix.minecraft }}
          version-type: release
          changelog-file: ${{ needs.plan.outputs.changelog }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          game-version-filter: none
          environment: client | server
          curseforge-dependencies: |
            ${{ vars.PERFOMANT_BOOM_PROJECT_ID }}(required)
            ${{ matrix.dependencies }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: fail

  github-release:
    name: Tag and publish verified GitHub release
    needs: [plan, checks, package, curseforge]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.release == 'true' && needs.checks.result == 'success' && needs.package.result == 'success' &&
      (needs.curseforge.result == 'success' || needs.curseforge.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts
      - name: Verify provenance and reserve the immutable version tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          python tools/release.py verify --directory artifacts
          git fetch origin --tags
          python tools/release.py guard-tag
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$GITHUB_SHA" -m "Celestial Nail $TAG"
            git push origin "refs/tags/$TAG"
          fi
      - name: Publish the tested bytes without overwriting a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          CHANGELOG: ${{ needs.plan.outputs.changelog }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" = false ]; then
              mkdir -p "$RUNNER_TEMP/existing-release"
              gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/existing-release"
              cmp artifacts/SHA256SUMS "$RUNNER_TEMP/existing-release/SHA256SUMS" || {
                echo 'Published bytes differ; do not overwrite them. Bump mod_version.' >&2; exit 1;
              }
              echo "$TAG is already published with matching checksums." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "Celestial Nail $TAG" --notes-file "$CHANGELOG"
          fi
          gh release upload "$TAG" artifacts/*.jar artifacts/SHA256SUMS artifacts/manifest.json --clobber
          gh release edit "$TAG" --draft=false
          echo "Published $TAG with all verified version/loader JARs." >> "$GITHUB_STEP_SUMMARY"
