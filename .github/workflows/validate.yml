name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: celestial-nail-${{ github.workflow }}-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: Common tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :common:test --stacktrace --no-daemon

  sodium-extras-compat:
    name: Packaged Extras compatibility (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: forge-1.20.1
            boom_tasks: ':common:publishToMavenLocal :forge:publishToMavenLocal'
          - target: fabric-1.20.1
            boom_tasks: ':common:publishToMavenLocal :fabric:publishToMavenLocal'
          - target: fabric-1.21.1
            boom_tasks: ':common-1.21.1:publishToMavenLocal :fabric-1.21.1:publishToMavenLocal'
          - target: neoforge-1.21.1
            boom_tasks: ':common-1.21.1:publishToMavenLocal :neoforge-1.21.1:publishToMavenLocal'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - uses: actions/checkout@v4
        with:
          repository: UpperMoon0/Perfomant-Boom
          ref: ${{ vars.PERFOMANT_BOOM_REF || 'main' }}
          path: .dependencies/perfomant-boom
          persist-credentials: false
      - name: Build matching Boom artifacts
        working-directory: .dependencies/perfomant-boom
        run: bash gradlew ${{ matrix.boom_tasks }} --no-daemon --max-workers=2
      - name: Install virtual display and OpenGL runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - run: python -m pip install -r tools/compat-requirements.txt
      - name: Test production jars, transformed culling and final images
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python tools/run_sodium_extras_compat.py --target '${{ matrix.target }}'
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium-extras-${{ matrix.target }}
          path: |
            build/reports/sodium-extras-compat/
            build/compat-runtime/${{ matrix.target }}/*/logs/
            build/compat-runtime/${{ matrix.target }}/*/crash-reports/
          if-no-files-found: warn

  build-1201:
    name: Build Minecraft 1.20.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check out Perfomant Boom API dependency
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/Perfomant-Boom
          ref: ${{ vars.PERFOMANT_BOOM_REF || 'main' }}
          path: .dependencies/perfomant-boom
          persist-credentials: false
      - name: Build matching Perfomant Boom artifacts
        working-directory: .dependencies/perfomant-boom
        run: bash gradlew :common:publishToMavenLocal :fabric:publishToMavenLocal :forge:publishToMavenLocal --no-daemon --max-workers=2
      - run: ./gradlew :fabric-1.20.1:build :forge-1.20.1:build --stacktrace --no-daemon

  build-1211:
    name: Build Minecraft 1.21.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check out Perfomant Boom API dependency
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/Perfomant-Boom
          ref: ${{ vars.PERFOMANT_BOOM_REF || 'main' }}
          path: .dependencies/perfomant-boom
          persist-credentials: false
      - name: Build matching Perfomant Boom artifacts
        working-directory: .dependencies/perfomant-boom
        run: bash gradlew :common-1.21.1:publishToMavenLocal :fabric-1.21.1:publishToMavenLocal :neoforge-1.21.1:publishToMavenLocal --no-daemon --max-workers=2
      - run: ./gradlew :fabric-1.21.1:build :neoforge-1.21.1:build --stacktrace --no-daemon
      - name: Runtime lifecycle and world-mutation regressions
        run: ./gradlew :neoforge-1.21.1:runGameTestServer --stacktrace --no-daemon
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.21.1-runtime-evidence
          path: neoforge-1.21.1/run/runtime-tests/logs/
          if-no-files-found: warn

  build-26:
    name: Build NeoForge 26.1.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check out Perfomant Boom API dependency
        uses: actions/checkout@v4
        with:
          repository: UpperMoon0/Perfomant-Boom
          ref: ${{ vars.PERFOMANT_BOOM_REF || 'main' }}
          path: .dependencies/perfomant-boom
          persist-credentials: false
      - name: Build matching Perfomant Boom artifacts
        working-directory: .dependencies/perfomant-boom
        run: bash gradlew :neoforge-26.1.2:publishToMavenLocal --no-daemon --max-workers=2
      - run: ./gradlew :neoforge-26.1.2:build --stacktrace --no-daemon

  release-tooling:
    name: Release contract and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/release.py check
      - name: Validate GitHub Actions workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/actionlint"
          mkdir -p "$directory"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz \
            --pattern actionlint_1.7.12_checksums.txt --dir "$directory"
          (cd "$directory"; grep '  actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum --check --strict)
          tar -xzf "$directory/actionlint_1.7.12_linux_amd64.tar.gz" -C "$directory"
          "$directory/actionlint" -color
