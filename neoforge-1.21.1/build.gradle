plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "${rootProject.archives_name}-neoforge-${rootProject.minecraft_version_1_21_1}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
sourceSets.main.java.srcDir rootProject.file('common-1.21.1/src/main/java')

neoForge {
    version = rootProject.neoforge_version_1_21_1

    runs {
        client { client() }
        smokeServer {
            server()
            gameDirectory = project.file('run/portal-smoke')
            programArgument '--nogui'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
}

sourceSets.main.resources.srcDir rootProject.file('common-1.21.1/src/main/resources')

processResources.doLast {
    ["celestial_nail.client.mixins.json"].each { configName ->
    def config = file("$destinationDir/$configName")
    def parsed = new groovy.json.JsonSlurper().parse(config)
    parsed.remove('refmap')
    config.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(parsed)) + '\n'
    }
}

// Isolated integration source set: never packaged into the production mod jar.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    addModdingDependenciesTo sourceSets.gameTest
    mods {
        "${rootProject.mod_id}" { sourceSet sourceSets.gameTest }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/runtime-tests')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minecraft'
        }
    }
}
tasks.named('runGameTestServer') {
    doFirst {
        copy {
            from project.file('src/gameTest/resources/gameteststructures')
            into project.file('run/runtime-tests/gameteststructures')
        }
    }
}

dependencies { implementation "com.nstut:perfomant_boom-neoforge-1.21.1:${rootProject.boom_version}" }
repositories { mavenLocal(); mavenCentral() }

apply from: rootProject.file('tools/gradle/sodium-extras-fixture.gradle')
