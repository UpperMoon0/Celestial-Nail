plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        runs {
            client {
                client()
                // Development uses named Minecraft classes; the packaged refmap is for production.
                vmArg "-Dmixin.env.disableRefMap=true"
                runDir("run/client")
            }
            server {
                server()
                runDir("run/server")
            }
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$forge_version"
    modImplementation "dev.architectury:architectury-forge:$architectury_api_version"

    common(project(path: ':common-1.20.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.20.1', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom { forge { mixinConfig "celestial_nail.client.mixins.json" } }

dependencies { modImplementation "com.nstut:perfomant_boom-forge:${rootProject.boom_version}" }
